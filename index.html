<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1d4ed8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="KarigarMitra" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>KarigarMitra – Quotation minute mein</title>
<style>
:root{--c:#1d4ed8;--cs:rgba(29,78,216,.10);--on:#fff;--cd:#1d4ed8;--hbg:rgba(255,255,255,.16);--bg:#f3f4f6;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--red:#dc2626;--green:#16a34a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans","Noto Sans Devanagari","Nirmala UI",Roboto,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35}
button{font:inherit;cursor:pointer;color:inherit}input,select,textarea{font:inherit}
.hidden{display:none!important}
/* header */
.hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--c);color:var(--on)}
.hb{min-width:40px;height:40px;border:none;border-radius:12px;background:var(--hbg);color:var(--on);font-size:19px;font-weight:800;display:grid;place-items:center;padding:0 9px}
.hb.lang{font-size:13px;display:flex;gap:4px}
.htitle{flex:1;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
main{max-width:600px;margin:0 auto;padding:10px 10px calc(96px + env(safe-area-inset-bottom))}
.scr{display:none}.scr.on{display:block}
/* common */
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sec{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:0 0 8px}
.sec .cnt{margin-left:auto;font-size:13px;color:var(--mut);font-weight:700}
label.l{display:block;font-size:13px;font-weight:700;color:#4b5563;margin:8px 0 4px}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:8px 12px;font-size:16px;outline:none}
textarea.inp{min-height:46px;resize:vertical;line-height:1.35}
.inp:focus{border-color:var(--cd);box-shadow:0 0 0 3px var(--cs)}
.inp.big{font-size:20px;font-weight:800;text-align:center}
.wm{display:flex;gap:6px}.wm .inp{flex:1}
.mic{flex:0 0 46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:19px}
.mic.rec{background:#fee2e2;border-color:var(--red);animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.08)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px;font-weight:800;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--c);border-color:var(--cd);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{color:var(--red)}.btn.w{width:100%}
.btn.dash{border-style:dashed;border-color:var(--cd);color:var(--cd);background:var(--cs)}
.ib{width:38px;height:38px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px;display:grid;place-items:center;flex:0 0 38px}
.mut{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;min-height:38px;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--c);border-color:var(--cd);color:#fff}
.chip small{font-weight:500;opacity:.7;font-size:11px}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.hscroll::-webkit-scrollbar{display:none}.hscroll .chip{flex:0 0 auto}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#f3f4f6;border-radius:12px;padding:4px}
.seg button{border:none;background:transparent;border-radius:9px;padding:6px 2px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;line-height:1.1}
.seg button i{font-style:normal;font-size:17px}
.seg button.on{background:#fff;color:var(--cd);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* onboarding & trade picker */
.ob h2{font-size:20px;margin:6px 0 4px;text-align:center}.ob p.sub{text-align:center;margin:0 0 12px}
.langbtn{display:block;width:100%;min-height:60px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:22px;font-weight:800}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbtn{position:relative;min-height:84px;border:2px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.15}
.tbtn .ic{font-size:26px}
.tbtn.on{border-color:var(--cd);background:var(--cs)}
.tbtn.on:after{content:"✓";position:absolute;top:4px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--on);font-size:12px;display:grid;place-items:center}
.tbtn.add{border-style:dashed;color:var(--cd)}
.addrow{display:flex;gap:6px;margin-top:8px}.addrow .inp{flex:1}
.steps{display:flex;justify-content:center;gap:5px;margin:2px 0 8px}.steps i{width:24px;height:5px;border-radius:9px;background:#d1d5db}.steps i.on{background:var(--c)}
.stick{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 calc(6px + env(safe-area-inset-bottom))}
/* home */
.shopcard{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--c);color:var(--on);font-size:22px;font-weight:900;display:grid;place-items:center;overflow:hidden;flex:0 0 46px}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.shopname{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newbtn{width:100%;border:none;border-radius:16px;background:var(--c);color:var(--on);min-height:64px;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;box-shadow:0 4px 12px var(--cs)}
.draft{width:100%;border:1.5px dashed var(--c);border-radius:14px;background:var(--cs);color:var(--cd);padding:10px 12px;text-align:left;margin-bottom:10px;font-weight:700}
.draft small{display:block;color:var(--mut);font-weight:500}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.t3 button{border:none;border-radius:14px;background:#fff;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.t3 button i{font-style:normal;font-size:24px}
.h3{font-size:14px;font-weight:800;color:var(--mut);margin:4px 2px 8px}
/* list cards */
.lc{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.lc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lc .t{font-weight:800;font-size:15px}.lc .s{font-size:12.5px;color:var(--mut)}
.lc .am{font-weight:900;color:var(--cd);white-space:nowrap}
.lc .acts{display:flex;gap:6px;margin-top:8px}.lc .acts .btn{flex:1;min-height:40px;font-size:14px;padding:0 8px}
/* item cards in quote */
.it{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.it .n{width:22px;height:22px;border-radius:50%;background:var(--cs);color:var(--cd);font-size:12px;font-weight:800;display:grid;place-items:center;flex:0 0 22px;margin-top:1px}
.it .b{flex:1;min-width:0}.it .nm{font-weight:800}.it .ds{color:var(--mut);font-size:12.5px;white-space:pre-wrap;max-height:34px;overflow:hidden}
.it .mt{font-size:12.5px;color:#374151;margin-top:2px}
.it .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.it .am{font-weight:900;color:var(--cd);white-space:nowrap}
.it .r .x{display:flex;gap:4px}.it .r .ib{width:32px;height:32px;flex-basis:32px;font-size:14px;border-radius:8px}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mut);font-size:14px;margin-bottom:8px}
.chg{display:grid;grid-template-columns:1fr 100px 38px;gap:6px;margin-bottom:6px}.chg .inp{min-height:42px}
.sw2{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;margin-top:8px;font-weight:700}
.tog{position:relative;width:50px;height:30px;flex:0 0 50px;display:inline-block}.tog input{opacity:0;width:0;height:0;position:absolute}
.tog span{position:absolute;inset:0;background:#d1d5db;border-radius:99px;transition:.2s}.tog span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog input:checked+span{background:var(--green)}.tog input:checked+span:before{transform:translateX(20px)}
.tot{width:100%;border-collapse:collapse;font-size:14.5px}
.tot td{padding:6px 2px;border-bottom:1px dashed var(--line)}.tot td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.tot tr.gr td{font-size:19px;font-weight:900;color:var(--cd);border-bottom:none}
.tot tr.bl td{font-weight:900;color:var(--red);border-bottom:none}
details.more>summary{list-style:none;cursor:pointer;font-weight:800;color:var(--cd);padding:4px 0;font-size:14px}
details.more>summary::-webkit-details-marker{display:none}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.07);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px}
.bar .sum{flex:1;min-width:0}.bar .sum small{display:block;font-size:11px;color:var(--mut);font-weight:700}.bar .sum b{font-size:20px;color:var(--cd);white-space:nowrap}
.bar .btn{min-height:50px;padding:0 14px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .sh{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--c);color:var(--on);font-size:17px;font-weight:800}
.sheet .sh .t{flex:1}
.sheet .body{flex:1;overflow:auto;padding:10px;max-width:600px;width:100%;margin:0 auto}
.sheet .foot{background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.sheet .foot .in{max-width:600px;margin:0 auto;display:flex;gap:8px;align-items:center}
.calc{font-size:13.5px;color:#374151;margin-top:8px;font-weight:700;background:var(--cs);border-radius:10px;padding:7px 10px}
.stp{display:grid;grid-template-columns:46px 1fr 46px;gap:6px}
.stp button{border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:22px;font-weight:900}
.sws{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;justify-items:center}.sw{width:100%;max-width:34px;aspect-ratio:1;height:auto;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-8px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.busy{position:fixed;inset:0;z-index:98;background:rgba(255,255,255,.6);display:none;place-items:center;font-size:40px}.busy.on{display:grid}
/* ---- v5 mobile polish ---- */
body{background:#eef1f6;font-size:15.5px}
.hdr{min-height:56px;box-shadow:0 2px 14px rgba(0,0,0,.14)}
.htitle{font-size:18px}
main{padding:12px 12px calc(112px + env(safe-area-inset-bottom))}
.card{border-radius:18px;padding:14px;border:1px solid rgba(16,24,40,.05);box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.04)}
.sec{font-size:16px;margin-bottom:10px}
.inp{background:#f8fafc;border-color:#e2e8f0}
.inp:focus{background:#fff}
.btn{border-radius:14px}
.mic{border-radius:14px;background:#f8fafc;border-color:#e2e8f0}
.shopcard{background:linear-gradient(135deg,var(--cs),#fff 75%)}
.logo{width:54px;height:54px;flex-basis:54px;border-radius:16px;font-size:24px}
.shopname{font-size:18px}
.newbtn{min-height:74px;border-radius:20px;font-size:20px;box-shadow:0 10px 24px var(--cs)}
.t3{gap:10px}.t3 button{border-radius:18px;min-height:88px;border:1px solid rgba(16,24,40,.05);box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.04)}
.t3 button i{font-size:28px}
.lc{border-radius:16px;padding:12px 14px;border:1px solid rgba(16,24,40,.05);box-shadow:0 1px 2px rgba(16,24,40,.05),0 4px 12px rgba(16,24,40,.03)}
.it{border-radius:14px;border-color:#e8ecf2;background:#fff}
.bar{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));border-radius:20px;border:1px solid var(--line);padding:8px 10px;box-shadow:0 10px 30px rgba(16,24,40,.18)}
#shSave{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 10px 24px rgba(16,24,40,.22);border-radius:16px}
.sheet .foot{border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(16,24,40,.08)}
.toast{border-radius:14px}
</style>
</head>
<body>

<header class="hdr">
  <button class="hb hidden" id="backBtn" aria-label="Back">←</button>
  <div class="htitle" id="hTitle">KarigarMitra</div>
  <button class="hb lang" id="langBtn" aria-label="Language">🌐<span id="langTag">EN</span></button>
</header>

<main>
<!-- ============ ONBOARDING ============ -->
<section class="scr ob" id="s-onboard">
  <div id="ob1">
    <div class="steps"><i class="on"></i><i></i><i></i></div>
    <h2>KarigarMitra</h2><p class="sub mut" style="margin-bottom:2px"><b>Quotation minute mein</b></p><p class="sub mut">Choose language · भाषा चुनें · भाषा निवडा</p>
    <button class="langbtn" data-lang="en">English</button>
    <button class="langbtn" data-lang="hi">हिंदी</button>
    <button class="langbtn" data-lang="mr">मराठी</button>
  </div>
  <div id="ob2" class="hidden">
    <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
    <h2 data-t="chooseTrade"></h2><p class="sub mut" data-t="chooseTradeSub"></p>
    <div id="obTrades"></div>
    <div class="stick"><button class="btn p w" id="obNext" style="min-height:54px;font-size:17px"><span data-t="next"></span> ▶</button></div>
  </div>
  <div id="ob3" class="hidden">
    <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <h2 data-t="shopDetails"></h2>
    <div class="card">
      <label class="l" style="margin-top:0" data-t="shopName"></label><input class="inp" id="obName" autocomplete="organization" data-tp="shopNamePh" />
      <label class="l" data-t="ownerName"></label><input class="inp" id="obOwner" autocomplete="name" />
      <label class="l" data-t="phone"></label><input class="inp" id="obPhone" type="tel" inputmode="tel" maxlength="15" />
      <label class="l" data-t="address"></label><textarea class="inp" id="obAddr" rows="2"></textarea>
      <p class="mut" style="margin:8px 0 0" data-t="englishTip"></p>
    </div>
    <div class="g2"><button class="btn" id="obBack">◀ <span data-t="back"></span></button><button class="btn p" id="obDone"><span data-t="start"></span> ✔</button></div>
  </div>
</section>

<!-- ============ HOME ============ -->
<section class="scr" id="s-home">
  <div class="card shopcard" id="homeShop"></div>
  <button class="newbtn" id="hNew">➕ <span data-t="newQuote"></span></button>
  <button class="draft hidden" id="hDraft">📝 <span data-t="continueQuote"></span><small id="hDraftInfo"></small></button>
  <div class="t3">
    <button id="hSaved"><i>📚</i><span data-t="oldQuotes"></span></button>
    <button id="hRates"><i>⭐</i><span data-t="rateList"></span></button>
    <button id="hShop"><i>🏪</i><span data-t="myShop"></span></button>
  </div>
  <div id="homeRecent"></div>
</section>

<!-- ============ QUOTE ============ -->
<section class="scr" id="s-quote">
  <div class="card">
    <div class="sec">👤 <span data-t="customer"></span></div>
    <div class="wm"><input class="inp" id="qcName" list="custList" autocomplete="off" data-tp="custName" /><button class="mic" data-mic="qcName">🎤</button></div>
    <datalist id="custList"></datalist>
    <div class="g2" style="margin-top:6px"><input class="inp" id="qcPhone" type="tel" inputmode="tel" maxlength="15" data-tp="phone" /><input class="inp" id="qcAddr" data-tp="siteAddress" /></div>
  </div>

  <div class="card">
    <div class="sec">📦 <span data-t="items"></span><span class="cnt" id="qItemCount"></span></div>
    <div id="qItems"></div>
    <button class="btn dash w" id="qAddItem" style="min-height:52px;font-size:16px">➕ <span data-t="addItem"></span></button>
  </div>

  <div class="card">
    <div class="sec">➕ <span data-t="extra"></span></div>
    <div id="qCharges"></div>
    <div class="hscroll">
      <button class="chip" data-chg="Transport">🚚 <span data-t="transport"></span></button>
      <button class="chip" data-chg="Labour Charges">👷 <span data-t="labour"></span></button>
      <button class="chip" data-chg="Fitting Charges">🔧 <span data-t="fitting"></span></button>
      <button class="chip" data-chg="">✚ <span data-t="other"></span></button>
    </div>
    <div class="g2"><div><label class="l" data-t="discount"></label><input class="inp" id="qDisc" type="number" inputmode="decimal" min="0" placeholder="0" /></div>
      <div><label class="l" data-t="advance"></label><input class="inp" id="qAdv" type="number" inputmode="decimal" min="0" placeholder="0" /></div></div>
    <div class="sw2"><span>🧾 <span data-t="gst"></span></span><label class="tog"><input type="checkbox" id="qGst" /><span></span></label></div>
    <div id="qGstBox" class="chips hidden"></div>
  </div>

  <div class="card">
    <table class="tot" id="qTotals"></table>
    <details class="more" style="margin-top:8px">
      <summary>⚙️ <span data-t="moreOptions"></span></summary>
      <div class="g2"><div><label class="l" data-t="quoteNo"></label><input class="inp" id="qNo" /></div><div><label class="l" data-t="date"></label><input class="inp" id="qDate" type="date" /></div></div>
      <label class="l" data-t="noteCust"></label>
      <div class="wm"><textarea class="inp" id="qNote" rows="2"></textarea><button class="mic" data-mic="qNote">🎤</button></div>
      <label class="l" data-t="terms"></label><textarea class="inp" id="qTerms" rows="4"></textarea>
      <button class="btn w" id="qNewBtn" style="margin-top:10px">🆕 <span data-t="newQuote"></span></button>
    </details>
  </div>
</section>

<!-- ============ SAVED ============ -->
<section class="scr" id="s-saved">
  <input class="inp" id="savedSearch" data-tp="search" style="margin-bottom:10px" />
  <div id="savedList"></div>
</section>

<!-- ============ RATES ============ -->
<section class="scr" id="s-rates">
  <p class="mut" style="margin:0 2px 8px" data-t="rateHelp"></p>
  <button class="btn dash w" id="rAdd" style="margin-bottom:10px">➕ <span data-t="addRate"></span></button>
  <div id="ratesList"></div>
</section>

<!-- ============ SHOP ============ -->
<section class="scr" id="s-shop">
  <div class="card">
    <div class="sec">🏪 <span data-t="shopDetails"></span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="logo" id="shLogoPrev">?</div>
      <label class="btn" style="min-height:40px">📷 <span data-t="uploadLogo"></span><input type="file" id="shLogoFile" accept="image/*" hidden /></label>
      <button class="ib" id="shLogoDel" style="color:var(--red)">✕</button>
    </div>
    <label class="l" data-t="shopName"></label><input class="inp" id="shName" />

/* ---- reusable multi-select trade picker ---- */
function tradePicker(boxId,selected,onChange){const box=$(boxId);
  const draw=()=>{box.innerHTML=`<div class="tgrid">${allTrades().map(tr=>`<button class="tbtn ${selected.includes(tr.id)?'on':''}" data-tr="${tr.id}"><span class="ic">${tr.ic}</span>${esc(tn(tr))}</button>`).join('')}<button class="tbtn add" data-tradd="1"><span class="ic">➕</span>${esc(t('addWork'))}</button></div><div class="addrow hidden"><input class="inp" placeholder="${esc(t('workName'))}" /><button class="btn p">✔</button></div>`;
    const row=box.querySelector('.addrow'),inp=row.querySelector('input'),ok=row.querySelector('button');
    box.querySelector('.tgrid').onclick=e=>{const b=e.target.closest('button');if(!b) return;
      if(b.dataset.tradd){row.classList.remove('hidden');inp.focus();return}
      const id=b.dataset.tr,i=selected.indexOf(id);if(i>-1) selected.splice(i,1);else selected.push(id);b.classList.toggle('on');onChange&&onChange()};
    const addIt=()=>{const name=inp.value.trim();if(!name) return;const ex=allTrades().find(x=>x.en.toLowerCase()===name.toLowerCase()||tn(x).toLowerCase()===name.toLowerCase());
      const id=ex?ex.id:'c_'+uid();if(!ex){ctrades.push({id,ic:'🔧',en:name,items:[]});store('ctrades',ctrades)}if(!selected.includes(id)) selected.push(id);draw();onChange&&onChange()};
    ok.onclick=addIt;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addIt()}}};
  draw()}

/* ------------------------------ CALCULATIONS ------------------------------ */
function calcItem(it){const f=MU[it.mu]||1,pcs=n(it.pcs)||1;let q=0,area=0,size='',qtyL=[];
  switch(it.mode){
    case 'sqft':area=r2(n(it.w)*f*n(it.h)*f);q=r2(area*pcs);size=`${fq(n(it.w))} x ${fq(n(it.h))} ${it.mu}`;qtyL=pcs===1?[`${fq(q)} Sq.ft`]:[`${fq(pcs)} Nos`,`${fq(q)} Sq.ft`];break;
    case 'rft':{const l=r2(n(it.len)*f);area=l;q=r2(l*pcs);size=`${fq(n(it.len))} ${it.mu}`;qtyL=pcs===1?[`${fq(q)} R.ft`]:[`${fq(pcs)} Nos`,`${fq(q)} R.ft`];break}
    case 'kg':q=n(it.kg);qtyL=[`${fq(q)} Kg`];break;
    case 'lump':q=1;qtyL=['1 Job'];break;
    default:q=pcs;qtyL=[`${fq(q)} Nos`]}
  return {q,area,size,qtyL,unit:(MODES[it.mode]||MODES.nos).u,amount:r2(q*n(it.rate))}}
function calcQuote(q){const rows=q.items.map(it=>({...it,...calcItem(it)}));const sub=r2(rows.reduce((s,r)=>s+r.amount,0));
  const charges=(q.charges||[]).filter(c=>n(c.amount)).map(c=>({label:(c.label||'').trim()||'Other Charges',amount:r2(c.amount)}));const chg=r2(charges.reduce((s,c)=>s+c.amount,0));
  const disc=r2(q.disc),taxable=r2(sub+chg-disc);let tax=[],taxT=0;
  if(q.gstOn&&n(q.gstRate)>0){const h=r2(taxable*n(q.gstRate)/200);tax=[[`CGST @ ${fq(n(q.gstRate)/2)}%`,h],[`SGST @ ${fq(n(q.gstRate)/2)}%`,h]];taxT=r2(2*h)}
  const pre=r2(taxable+taxT),grand=Math.round(pre),adv=r2(q.adv);
  return {rows,sub,charges,chg,disc,taxable,tax,taxT,pre,round:r2(grand-pre),grand,adv,bal:r2(grand-adv)}}
function totalRows(c){const r=[['subTotal','Sub Total',c.sub]];c.charges.forEach(x=>r.push([null,x.label,x.amount]));if(c.disc) r.push(['discount','Less: Discount',-c.disc]);if(c.tax.length){r.push(['taxable','Taxable Amount',c.taxable]);c.tax.forEach(x=>r.push([null,x[0],x[1]]))}if(c.round) r.push(['roundOff','Round Off',c.round]);return r}

function isLight(h){const [r,g,b]=hexRgb(h).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b>.45}
const darken=(c,k)=>c.map(v=>v*(1-k));
function hexRgb(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');const v=m?parseInt(m[1],16):0x1d4ed8;return [(v>>16&255)/255,(v>>8&255)/255,(v&255)/255]}
function applyBrand(){const s=shop();if(!s) return;const c=s.color||COLORS[0],rgb=hexRgb(c).map(v=>Math.round(v*255));document.documentElement.style.setProperty('--c',c);document.documentElement.style.setProperty('--cs',`rgba(${rgb.join(',')},${isLight(c)?.28:.12})`);const lt=isLight(c),dk=lt?darken(hexRgb(c),.5).map(v=>Math.round(v*255)):rgb;document.documentElement.style.setProperty('--on',lt?'#111827':'#fff');document.documentElement.style.setProperty('--cd',`rgb(${dk.join(',')})`);document.documentElement.style.setProperty('--hbg',lt?'rgba(0,0,0,.08)':'rgba(255,255,255,.16)');document.querySelector('meta[name=theme-color]').content=c}

  const sw=$('homeSwitch');if(sw) sw.onchange=e=>switchShop(e.target.value);const he=$('homeEdit');if(he) he.onclick=()=>{editShopId=activeId;go('shop')};

function itemMeta(r){
  if(r.mode==='sqft') return `${fq(n(r.w))}×${fq(n(r.h))} ${r.mu}${n(r.pcs)>1?` ×${fq(n(r.pcs))}`:''} = ${fq(r.q)} ${t('sqftOf')} × ₹${fq(r.rate)}`;
  if(r.mode==='rft') return `${fq(n(r.len))} ${r.mu}${n(r.pcs)>1?` ×${fq(n(r.pcs))}`:''} = ${fq(r.q)} ${t('rftOf')} × ₹${fq(r.rate)}`;
  if(r.mode==='kg') return `${fq(r.q)} Kg × ₹${fq(r.rate)}`;
  if(r.mode==='lump') return `💰 ${t('lumpsum')}`;
  return `${fq(r.q)} × ₹${fq(r.rate)}`}

const pdfName=q=>`Quotation_${String(q.no).replace(/[^a-z0-9-]/gi,'_')}_${String(q.cust?.name||'').replace(/[^a-z0-9]+/gi,'_').slice(0,25)||'Customer'}.pdf`;
function waText(q){const s=shops.find(x=>x.id===q.shopId)||shop();return `Namaste${q.cust?.name?' '+q.cust.name:''} 🙏\nQuotation ${q.no} from *${s.name}*\nTotal: *Rs. ${fmtQ.format(q.total||calcQuote(q).grand)}*${s.phone?'\nContact: '+s.phone:''}`}
async function makeFile(q){const s=shops.find(x=>x.id===q.shopId)||shop();const {blob,pages}=await buildPdf(q,s);return {file:new File([blob],pdfName(q),{type:'application/pdf'}),blob,pages}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
const busy=on=>$('busy').classList.toggle('on',on);
async function sharePdf(q){busy(true);try{const {file,blob}=await makeFile(q);busy(false);
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:waText(q)});return}catch(e){if(e.name==='AbortError') return}}
  download(blob,file.name);const ph=String(q.cust?.phone||'').replace(/\D/g,'');const to=ph.length===10?'91'+ph:ph;setTimeout(()=>window.open(`https://wa.me/${to}?text=${encodeURIComponent(waText(q)+'\n(PDF attached)')}`,'_blank'),600)}catch(e){busy(false);console.error(e);toast('PDF error')}}
async function downloadPdf(q){busy(true);try{const {blob,file}=await makeFile(q);download(blob,file.name);toast(t('pdfReady'))}catch(e){console.error(e);toast('PDF error')}busy(false)}

  $('qGst').onchange=e=>{Q.gstOn=e.target.checked;$('qGstBox').classList.toggle('hidden',!Q.gstOn);saveDraft();renderTotals()};
  $('qGstBox').onclick=e=>{const b=e.target.closest('[data-gstr]');if(!b) return;Q.gstRate=n(b.dataset.gstr);$('qGstBox').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));saveDraft();renderTotals()};
  document.querySelectorAll('[data-chg]').forEach(b=>b.onclick=()=>{Q.charges.push({label:b.dataset.chg,amount:''});saveDraft();renderCharges();const rows=$('qCharges').querySelectorAll('.chg');const last=rows[rows.length-1];(b.dataset.chg?last.children[1]:last.children[0]).focus()});
  $('qAddItem').onclick=()=>openItemSheet('quote',null);
  $('qSend').onclick=()=>{if(saveQuote()) sharePdf(Q)};
  $('qDown').onclick=()=>{if(saveQuote()) downloadPdf(Q)};
  $('qNewBtn').onclick=()=>{if(Q.items.length&&!Q.id&&!confirm(t('confirmNew'))) return;startNew()};
  $('siClose').onclick=closeSheet;$('siOk').onclick=sheetOk;
  $('siModes').onclick=e=>{const b=e.target.closest('[data-m]');if(!b) return;readSheet();sheetItem.mode=b.dataset.m;renderSheet()};
  $('siUnits').onclick=e=>{const b=e.target.closest('[data-u]');if(!b) return;readSheet();sheetItem.mu=b.dataset.u;renderSheet()};
  $('siTabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b) return;sheetTab=b.dataset.tab;renderPresets()};
  $('siPresets').onclick=e=>{const b=e.target.closest('.chip');if(!b) return;readSheet();
    if(b.dataset.rate){const r=rates.find(x=>x.id===b.dataset.rate);if(r){sheetItem.name=r.name;sheetItem.mode=r.mode;sheetItem.mu=r.mu||sheetItem.mu;sheetItem.rate=r.rate;if(r.desc&&!sheetItem.desc) sheetItem.desc=r.desc}}
    else{sheetItem.name=b.dataset.preset;sheetItem.mode=b.dataset.mode}
    $('siPresets').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
    $('siName').value=sheetItem.name;$('siRate').value=sheetItem.rate;$('siDesc').value=sheetItem.desc||'';renderSheet();
    const f={sqft:'siW',rft:'siLen',kg:'siKg',nos:'siRate',lump:'siRate'}[sheetItem.mode];$(sheetPurpose==='rate'?'siRate':f).focus()};
  ['siW','siH','siLen','siKg','siPcs','siRate','siName'].forEach(id=>$(id).addEventListener('input',updateSheetCalc));
  $('siMinus').onclick=()=>{$('siPcs').value=Math.max(1,n($('siPcs').value)-1);updateSheetCalc()};$('siPlus').onclick=()=>{$('siPcs').value=n($('siPcs').value)+1;updateSheetCalc()};
  document.querySelectorAll('[data-mic]').forEach(b=>b.onclick=()=>voice(b));
  $('savedSearch').oninput=renderSaved;$('rAdd').onclick=()=>openItemSheet('rate',null);
  $('shSave').onclick=saveShopForm;$('shAdd').onclick=startAddShop;
  $('shColors').onclick=e=>{const b=e.target.closest('[data-color]');if(!b) return;$('shColors').dataset.val=b.dataset.color;$('shColors').querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))};
  $('shLogoFile').onchange=e=>{handleLogo(e.target.files[0]);e.target.value=''};$('shLogoDel').onclick=()=>{shopLogo={logo:'',w:0,h:0};renderLogoPrev($('shName').value)};
  $('bkExport').onclick=exportBackup;$('bkImport').onchange=e=>{importBackup(e.target.files[0]);e.target.value=''};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
  $('installBtn').onclick=async()=>{if(!deferredPrompt){toast(t('installTip'));return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null};
}
function init(){applyI18n();bind();
  if(!lang) showOb(1);else if(!shops.length) showOb(2);else{if(!shops.some(s=>s.id===activeId)){activeId=shops[0].id;store('active',activeId)}applyBrand();go('home',false)}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{})}
window.QDK={buildPdf,calcQuote,get Q(){return Q},shop};
document.addEventListener('DOMContentLoaded',init,{once:true});
</script>
</body>
</html>
